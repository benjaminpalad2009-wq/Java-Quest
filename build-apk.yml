name: Build Java Quest APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare the Android project
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest www/
          cp -r icons www/icons
          cat > package.json <<'EOF'
          {
            "name": "java-quest",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^6.0.0",
              "@capacitor/android": "^6.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.0.0"
            }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.javaquest.app",
            "appName": "Java Quest",
            "webDir": "www",
            "server": { "androidScheme": "https" }
          }
          EOF
          npm install --legacy-peer-deps
          npx cap add android
          npx cap sync android

      - name: Use the Java Quest icon
        continue-on-error: true
        run: |
          pip install pillow
          python3 - <<'EOF'
          from PIL import Image
          import os
          res = 'android/app/src/main/res'
          src = Image.open('icons/icon-maskable-512.png').convert('RGBA')
          foreground = {'mdpi': 108, 'hdpi': 162, 'xhdpi': 216, 'xxhdpi': 324, 'xxxhdpi': 432}
          legacy = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          for density, size in foreground.items():
              folder = res + '/mipmap-' + density
              if not os.path.isdir(folder):
                  continue
              src.resize((size, size), Image.LANCZOS).save(folder + '/ic_launcher_foreground.png')
              small = src.resize((legacy[density], legacy[density]), Image.LANCZOS)
              small.save(folder + '/ic_launcher.png')
              small.save(folder + '/ic_launcher_round.png')
          with open(res + '/values/ic_launcher_background.xml', 'w') as f:
              f.write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#121A3B</color>\n</resources>\n')
          EOF

      - name: Build the APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../java-quest.apk

      - name: Publish the APK as a download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: java-quest-${{ github.run_number }}
          name: Java Quest ${{ github.run_number }}
          files: java-quest.apk
